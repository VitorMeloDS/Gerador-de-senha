<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/styles/styles.css">
  <link rel="stylesheet" href="./src/styles/responsive.css">
  <link rel="shortcut icon" href="./src/assets/favicon.png" type="image/x-icon">
  <title>Gerador de Senha</title>
</head>
<body>
  <div class="container">
    <div class="gerador-container">
      <div class="senha-container">
        <h1>🔐 Gerador de Senha</h1>
        
        <div class="input-group">
          <label for="geraSenha" class="label"><b>Tamanho da Senha:</b></label>
          <div class="input-with-controls">
            <button onclick="diminuirTamanho()" class="btn-tamanho">−</button>
            <input type="number" id="geraSenha" min="4" max="128" value="12">
            <button onclick="aumentarTamanho()" class="btn-tamanho">+</button>
          </div>
          <span id="tamanho"></span>
        </div>

        <div class="opcoes-senha">
          <label class="checkbox-label">
            <input type="checkbox" id="incluirMaiusculas" checked>
            Maiúsculas (A-Z)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="incluirMinusculas" checked>
            Minúsculas (a-z)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="incluirNumeros" checked>
            Números (0-9)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="incluirSimbolos" checked>
            Símbolos (!@#$%&*)
          </label>
        </div>

        <button onclick="gerarSenha()" class="btn-gerar">Gerar Senha</button>
      </div>
    </div>

    <div class="container-senha">
      <div class="senha-gerada">
        <label for="result" class="label"><b>Senha Gerada:</b></label>
        <div class="senha-result-container">
          <input type="text" id="result" readonly>
          <button onclick="copiarSenha()" class="btn-copiar" title="Copiar senha">
            📋
          </button>
        </div>
        <div id="forcaSenha" class="forca-senha"></div>
      </div>
    </div>
  </div>

  <script src="./src/javascript/index.js"></script>
</body>
</html>
